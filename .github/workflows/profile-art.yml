name: Profile art

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-art.yml
      - .github/profile-3d.json

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d.json

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#3DDCFF&color_dots=#151B28,#1B3157,#2A55A8,#4D7CFF,#9A7BFF
            dist/snake-light.svg?color_snake=#4D7CFF&color_dots=#EBEFF5,#C9D8FF,#93B0FF,#5B82F5,#7B5CFF

      - name: Collect images
        run: cp profile-3d-contrib/*.svg dist/

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh profile art"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
